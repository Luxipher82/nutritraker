<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Cibo & Nutrizione</title>
  
  <!-- Libreria SheetJS per leggere i file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #2e7d32;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.2rem;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      opacity: 0.9;
    }

    .status-message {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .food-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .food-item {
      padding: 12px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .food-item:last-child {
      border-bottom: none;
    }

    .food-info {
      display: flex;
      flex-direction: column;
    }

    .food-title {
      font-weight: bold;
      font-size: 1rem;
    }

    .food-brand {
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
    }

    .food-macros {
      font-size: 0.85rem;
      color: #444;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- SEZIONE IMPORTAZIONE EXCEL -->
  <div class="card">
    <h2>➕ Carica da Tabella Excel</h2>
    <div class="file-input-wrapper">
      <input type="file" id="excelFileInput" accept=".xlsx, .xls">
      <button onclick="importaExcel()">Importa Foglio Excel</button>
    </div>
    <div id="statusMessage" class="status-message"></div>
  </div>

  <!-- SEZIONE RICERCA CIBO -->
  <div class="card">
    <h2>🔍 Ricerca Alimento</h2>
    <input type="text" id="searchInput" placeholder="Es. yogurt, bresaola, primia..." oninput="gestisciRicerca()">
  </div>

  <!-- RISULTATI RICERCA -->
  <div class="card">
    <ul id="foodList" class="food-list">
      <li style="color: #777;">Carica un file Excel o inizia a digitare per cercare...</li>
    </ul>
  </div>

</div>

<script>
  // Inizializza il database locale leggendo da localStorage o creando un array vuoto
  let databaseCibo = JSON.parse(localStorage.getItem('databaseCibo')) || [];

  // Al caricamento della pagina, mostra i dati già salvati
  document.addEventListener('DOMContentLoaded', () => {
    if (databaseCibo.length > 0) {
      mostraMessaggio(`Caricati ${databaseCibo.length} alimenti dalla memoria locale.`, 'green');
      mostraRisultati(databaseCibo.slice(0, 10)); // Mostra i primi 10
    }
  });

  // Funzione per importare e normalizzare il file Excel
  function importaExcel() {
    const input = document.getElementById('excelFileInput');
    const status = document.getElementById('statusMessage');

    if (!input.files || input.files.length === 0) {
      mostraMessaggio("Seleziona prima un file .xlsx!", "red");
      return;
    }

    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        // Prendi il primo foglio dell'Excel
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        // Converte il foglio in matrice di righe
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

        if (rows.length === 0) {
          mostraMessaggio("Il file Excel è vuoto!", "red");
          return;
        }

        // Trova la riga che contiene l'intestazione 'alimento' o 'alimento '
        let headerIndex = -1;
        for (let i = 0; i < rows.length; i++) {
          const rowStr = rows[i].join(" ").toLowerCase();
          if (rowStr.includes("alimento")) {
            headerIndex = i;
            break;
          }
        }

        if (headerIndex === -1) {
          mostraMessaggio("Impossibile trovare la colonna 'alimento' nel file!", "red");
          return;
        }

        // Normalizza le intestazioni (rimuove spazi vuoti iniziali e finali)
        const headers = rows[headerIndex].map(h => String(h).trim().toLowerCase());

        // Mappa le righe successive trasformandole in oggetti
        const alimentiPuliti = [];
        for (let i = headerIndex + 1; i < rows.length; i++) {
          const row = rows[i];
          
          // Salta le righe vuote
          if (!row || row.every(val => val === "")) continue;

          let item = {};
          headers.forEach((header, index) => {
            if (header) {
              item[header] = row[index] !== undefined ? row[index] : "";
            }
          });

          // Aggiungi solo se ha un nome alimento valido
          const nomeAlimento = item['alimento'] || item['nome'];
          if (nomeAlimento && String(nomeAlimento).trim() !== "") {
            alimentiPuliti.push(item);
          }
        }

        // Salva in memoria locale
        databaseCibo = alimentiPuliti;
        localStorage.setItem('databaseCibo', JSON.stringify(databaseCibo));

        mostraMessaggio(`🎉 Importati con successo ${databaseCibo.length} alimenti!`, 'green');
        mostraRisultati(databaseCibo.slice(0, 10));

      } catch (err) {
        console.error(err);
        mostraMessaggio("Errore nella lettura del file Excel.", "red");
      }
    };

    reader.readAsArrayBuffer(file);
  }

  // Funzione di ricerca tollerante e sicura
  function gestisciRicerca() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();

    if (!query) {
      mostraRisultati(databaseCibo.slice(0, 10));
      return;
    }

    const risultati = databaseCibo.filter(item => {
      const alimento = String(item['alimento'] || item['nome'] || '').toLowerCase();
      const marca = String(item['marca'] || '').toLowerCase();

      return alimento.includes(query) || marca.includes(query);
    });

    mostraRisultati(risultati);
  }

  // Funzione per mostrare i risultati a schermo
  function mostraRisultati(lista) {
    const listContainer = document.getElementById('foodList');
    listContainer.innerHTML = "";

    if (lista.length === 0) {
      listContainer.innerHTML = "<li style='padding: 12px; color: #777;'>Nessun alimento trovato.</li>";
      return;
    }

    lista.forEach(item => {
      const li = document.createElement('li');
      li.className = 'food-item';

      const nome = item['alimento'] || item['nome'] || 'Senza nome';
      const marca = item['marca'] ? item['marca'] : '';
      const kcal = item['kcal'] || 0;
      const carboidrati = item['carboidrati'] || 0;
      const proteine = item['proteine'] || 0;
      const grassi = item['grassi'] || 0;

      li.innerHTML = `
        <div class="food-info">
          ${marca ? `<span class="food-brand">${marca}</span>` : ''}
          <span class="food-title">${nome}</span>
          <span class="food-macros">${kcal} kcal | C: ${carboidrati}g | P: ${proteine}g | G: ${grassi}g</span>
        </div>
      `;

      listContainer.appendChild(li);
    });
  }

  function mostraMessaggio(testo, colore) {
    const status = document.getElementById('statusMessage');
    status.innerText = testo;
    status.style.color = colore === 'red' ? '#d32f2f' : '#2e7d32';
  }
</script>

</body>
</html>
