<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker & Nutrition Log</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .btn-icon:hover {
            background-color: var(--border-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
            position: relative;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select, button {
            font-size: 0.95rem;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            border: none;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 8px;
        }

        .macro-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            background-color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .macro-box h4 {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .macro-box p {
            margin: 4px 0 0 0;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .meal-section {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
        }

        .meal-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .food-list {
            list-style: none;
            padding: 0;
            margin: 0 0 8px 0;
        }

        .food-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.85rem;
        }

        .food-info {
            display: flex;
            flex-direction: column;
        }

        .food-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .autocomplete-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: var(--shadow);
            display: none;
        }

        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .autocomplete-item:hover {
            background-color: #f3f4f6;
        }

        /* Drawer Overlay */
        .drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-body {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .history-item, .recipe-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-date, .recipe-name {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .history-details, .recipe-details {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="card header">
        <div style="display:flex; align-items:center; gap:8px;">
            <select id="sexSelect" onchange="switchProfile()">
                <option value="Uomo">Uomo ♂</option>
                <option value="Donna">Donna ♀</option>
            </select>
            <h1 id="appTitle">Diario Alimentare</h1>
        </div>
        <div>
            <button class="btn-icon" onclick="openDrawer('recipesDrawer')" title="Pasti Salvati">🍲</button>
            <button class="btn-icon" onclick="openDrawer('profileDrawer')" title="Profilo">⚙️</button>
            <button class="btn-icon" onclick="openDrawer('historyDrawer')" title="Storico">📅</button>
        </div>
    </div>

    <!-- Sezione Peso & TDEE Calcolato -->
    <div class="card">
        <div class="grid-2">
            <div class="form-group">
                <label>Peso Attuale (kg)</label>
                <div style="display:flex; gap:6px;">
                    <input type="number" id="currentWeightInput" step="0.1" placeholder="70.0">
                    <button class="btn btn-sm" onclick="addWeightRecord()">Salva</button>
                </div>
            </div>
            <div class="form-group">
                <label>Obiettivo Kcal (TDEE/Deficit)</label>
                <input type="number" id="targetKcalDisplay" readonly style="background-color: #f3f4f6;">
            </div>
        </div>
        <div style="height: 120px; width:100%; margin-top: 8px;">
            <canvas id="weightChart"></canvas>
        </div>
    </div>

    <!-- Riassunto Giornaliero -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; font-size:0.95rem;">Totale Oggi</span>
            <span id="dateDisplay" style="font-size:0.8rem; color:var(--text-muted);"></span>
        </div>
        <div class="macro-summary">
            <div class="macro-box">
                <h4>Kcal</h4>
                <p id="totKcal">0 / 0</p>
            </div>
            <div class="macro-box">
                <h4>Prot</h4>
                <p id="totP">0g</p>
            </div>
            <div class="macro-box">
                <h4>Gras</h4>
                <p id="totG">0g</p>
            </div>
            <div class="macro-box">
                <h4>Carb</h4>
                <p id="totC">0g</p>
            </div>
        </div>
    </div>

    <!-- Pasti -->
    <div class="card">
        <!-- Colazione -->
        <div class="meal-section" style="border-top:none; margin-top:0; padding-top:0;">
            <div class="meal-title">
                <span>☕ Colazione</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <span id="sub-colazione" style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">0 kcal</span>
                    <button class="btn-icon" style="font-size:0.9rem;" onclick="openRecipeSelector('colazione')" title="Aggiungi Pasto Salvato">🍲</button>
                </div>
            </div>
            <ul class="food-list" id="list-colazione"></ul>
            <div class="grid-3">
                <div class="form-group" style="margin:0;">
                    <input type="text" id="foodInput-colazione" placeholder="Cerca cibo..." oninput="handleSearch('colazione')">
                    <div class="autocomplete-results" id="searchResults-colazione"></div>
                </div>
                <input type="number" id="foodGrams-colazione" placeholder="g/ml" style="margin:0;">
                <button class="btn btn-sm" onclick="addFoodToMeal('colazione')">+</button>
            </div>
        </div>

        <!-- Pranzo -->
        <div class="meal-section">
            <div class="meal-title">
                <span>🥗 Pranzo</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <span id="sub-pranzo" style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">0 kcal</span>
                    <button class="btn-icon" style="font-size:0.9rem;" onclick="openRecipeSelector('pranzo')" title="Aggiungi Pasto Salvato">🍲</button>
                </div>
            </div>
            <ul class="food-list" id="list-pranzo"></ul>
            <div class="grid-3">
                <div class="form-group" style="margin:0;">
                    <input type="text" id="foodInput-pranzo" placeholder="Cerca cibo..." oninput="handleSearch('pranzo')">
                    <div class="autocomplete-results" id="searchResults-pranzo"></div>
                </div>
                <input type="number" id="foodGrams-pranzo" placeholder="g/ml" style="margin:0;">
                <button class="btn btn-sm" onclick="addFoodToMeal('pranzo')">+</button>
            </div>
        </div>

        <!-- Cena -->
        <div class="meal-section">
            <div class="meal-title">
                <span>🍖 Cena</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <span id="sub-cena" style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">0 kcal</span>
                    <button class="btn-icon" style="font-size:0.9rem;" onclick="openRecipeSelector('cena')" title="Aggiungi Pasto Salvato">🍲</button>
                </div>
            </div>
            <ul class="food-list" id="list-cena"></ul>
            <div class="grid-3">
                <div class="form-group" style="margin:0;">
                    <input type="text" id="foodInput-cena" placeholder="Cerca cibo..." oninput="handleSearch('cena')">
                    <div class="autocomplete-results" id="searchResults-cena"></div>
                </div>
                <input type="number" id="foodGrams-cena" placeholder="g/ml" style="margin:0;">
                <button class="btn btn-sm" onclick="addFoodToMeal('cena')">+</button>
            </div>
        </div>

        <!-- Snacking -->
        <div class="meal-section">
            <div class="meal-title">
                <span>🍎 Snack / Extra</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <span id="sub-snack" style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">0 kcal</span>
                    <button class="btn-icon" style="font-size:0.9rem;" onclick="openRecipeSelector('snack')" title="Aggiungi Pasto Salvato">🍲</button>
                </div>
            </div>
            <ul class="food-list" id="list-snack"></ul>
            <div class="grid-3">
                <div class="form-group" style="margin:0;">
                    <input type="text" id="foodInput-snack" placeholder="Cerca cibo..." oninput="handleSearch('snack')">
                    <div class="autocomplete-results" id="searchResults-snack"></div>
                </div>
                <input type="number" id="foodGrams-snack" placeholder="g/ml" style="margin:0;">
                <button class="btn btn-sm" onclick="addFoodToMeal('snack')">+</button>
            </div>
        </div>

        <!-- Pulsante Salva Giornata -->
        <div style="margin-top:16px;">
            <button class="btn" style="width:100%; padding:10px;" onclick="saveCurrentDayToHistory()">💾 Salva Giornata nel Registro</button>
        </div>
    </div>
</div>

<!-- DRAWER PROFILO & CONFIGURAZIONE -->
<div class="drawer" id="profileDrawer">
    <div class="drawer-header">
        <h3>Impostazioni Profilo</h3>
        <button class="btn-icon" onclick="closeDrawer('profileDrawer')">✕</button>
    </div>
    <div class="drawer-body">
        <div class="form-group">
            <label>Età</label>
            <input type="number" id="age" value="30" onchange="updateProfileSettings()">
        </div>
        <div class="form-group">
            <label>Altezza (cm)</label>
            <input type="number" id="height" value="175" onchange="updateProfileSettings()">
        </div>
        <div class="form-group">
            <label>Livello di Attività (LAF)</label>
            <select id="activity" onchange="updateProfileSettings()">
                <option value="1.2">Sedentario (1.2)</option>
                <option value="1.375">Leggermente Attivo (1.375)</option>
                <option value="1.55">Moderatamente Attivo (1.55)</option>
                <option value="1.725">Molto Attivo (1.725)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Deficit / Surplus Calorico</label>
            <select id="deficitSelect" onchange="updateProfileSettings()">
                <option value="0">Mantenimento (0%)</option>
                <option value="-10">Deficit Leggero (-10%)</option>
                <option value="-15" selected>Deficit Moderato (-15%)</option>
                <option value="-20">Deficit Intenso (-20%)</option>
                <option value="10">Surplus (+10%)</option>
            </select>
        </div>
    </div>
</div>

<!-- DRAWER PASTI SALVATI / RICETTE -->
<div class="drawer" id="recipesDrawer">
    <div class="drawer-header">
        <h3>Pasti Salvati</h3>
        <button class="btn-icon" onclick="closeDrawer('recipesDrawer')">✕</button>
    </div>
    <div class="drawer-body">
        <div style="margin-bottom:12px; border-bottom:1px solid var(--border-color); padding-bottom:12px;">
            <button class="btn" style="width:100%;" onclick="saveCurrentMealAsRecipe()">➕ Salva Pasto Corrente come Ricetta</button>
        </div>
        <div id="recipesList">
            <!-- Renderizzato via JS -->
        </div>
    </div>
</div>

<!-- DRAWER STORICO -->
<div class="drawer" id="historyDrawer">
    <div class="drawer-header">
        <h3>Storico Giornate</h3>
        <button class="btn-icon" onclick="closeDrawer('historyDrawer')">✕</button>
    </div>
    <div class="drawer-body" id="historyList">
        <!-- Renderizzato via JS -->
    </div>
</div>

<script>
    // DB di Base per Autocomplete (Estendibile)
    const FOOD_DATABASE = [
        { nome: "Petto di Pollo", marca: "Generico", kcal: 110, p: 23, g: 1, c: 0, porzione_g: 100 },
        { nome: "Riso Basmati", marca: "Generico", kcal: 350, p: 7, g: 0.5, c: 78, porzione_g: 80 },
        { nome: "Olio Extravergine d'Oliva", marca: "Generico", kcal: 884, p: 0, g: 100, c: 0, porzione_g: 10 },
        { nome: "Uovo Intero", marca: "Generico", kcal: 143, p: 12.6, g: 9.5, c: 0.7, porzione_g: 60 },
        { nome: "Yogurt Greco 0%", marca: "Fage", kcal: 54, p: 10.3, g: 0, c: 3, porzione_g: 170 },
        { nome: "Pane Integrale", marca: "Generico", kcal: 247, p: 13, g: 3.4, c: 41, porzione_g: 50 },
        { nome: "Fiocchi d'Avena", marca: "Generico", kcal: 389, p: 16.9, g: 6.9, c: 66, porzione_g: 50 },
        { nome: "Salmone Fresco", marca: "Generico", kcal: 208, p: 20, g: 13, c: 0, porzione_g: 150 },
        { nome: "Banana", marca: "Generico", kcal: 89, p: 1.1, g: 0.3, c: 23, porzione_g: 120 },
        { nome: "Mela", marca: "Generico", kcal: 52, p: 0.3, g: 0.2, c: 14, porzione_g: 150 }
    ];

    let appData = {
        activeSex: 'Uomo',
        profiles: {
            Uomo: { age: 30, height: 175, activity: 1.375, deficitPct: -15, weightHistory: [] },
            Donna: { age: 30, height: 165, activity: 1.375, deficitPct: -15, weightHistory: [] }
        },
        dailyLogs: [],
        recipes: []
    };

    let currentSex = 'Uomo';
    let currentDayFoods = [];
    let weightChartInstance = null;

    // Inizializzazione
    window.onload = function() {
        loadDataFromStorage();
        loadProfileUI();
        initChart();
        renderHistory();
        renderRecipes();

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.form-group')) {
                document.querySelectorAll('.autocomplete-results').forEach(el => el.style.display = 'none');
            }
        });

        const todayStr = new Date().toLocaleDateString('it-IT');
        document.getElementById('dateDisplay').innerText = todayStr;
    };

    function generateID() {
        return Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    }

    function loadDataFromStorage() {
        const stored = localStorage.getItem('fitTrackerData');
        if (stored) {
            try {
                appData = JSON.parse(stored);
            } catch(e) {
                console.error("Errore nel parsing dei dati caricati", e);
            }
        }
        currentSex = appData.activeSex || 'Uomo';
        document.getElementById('sexSelect').value = currentSex;
    }

    function saveDataToStorage() {
        appData.activeSex = currentSex;
        localStorage.setItem('fitTrackerData', JSON.stringify(appData));
    }

    function switchProfile() {
        const oldProf = appData.profiles[currentSex];
        if (oldProf) {
            oldProf.age = parseFloat(document.getElementById('age').value) || oldProf.age;
            oldProf.height = parseFloat(document.getElementById('height').value) || oldProf.height;
            oldProf.activity = parseFloat(document.getElementById('activity').value) || oldProf.activity;
            oldProf.deficitPct = parseFloat(document.getElementById('deficitSelect').value) || oldProf.deficitPct;
        }

        currentSex = document.getElementById('sexSelect').value;
        appData.activeSex = currentSex;
        saveDataToStorage();
        loadProfileUI();
    }

    function loadProfileUI() {
        const prof = appData.profiles[currentSex];
        document.getElementById('age').value = prof.age || 30;
        document.getElementById('height').value = prof.height || 175;
        document.getElementById('activity').value = prof.activity || 1.375;
        document.getElementById('deficitSelect').value = prof.deficitPct || -15;
        
        const lastWeightRecord = prof.weightHistory && prof.weightHistory.length > 0 
            ? prof.weightHistory[prof.weightHistory.length - 1].weight 
            : '';
        document.getElementById('currentWeightInput').value = lastWeightRecord;

        calculateTargetKcal();
        updateChart();
    }

    function updateProfileSettings() {
        const prof = appData.profiles[currentSex];
        prof.age = parseFloat(document.getElementById('age').value) || 30;
        prof.height = parseFloat(document.getElementById('height').value) || 175;
        prof.activity = parseFloat(document.getElementById('activity').value) || 1.375;
        prof.deficitPct = parseFloat(document.getElementById('deficitSelect').value) || 0;
        
        saveDataToStorage();
        calculateTargetKcal();
    }

    function calculateTargetKcal() {
        const prof = appData.profiles[currentSex];
        const lastWeightRecord = prof.weightHistory && prof.weightHistory.length > 0 
            ? prof.weightHistory[prof.weightHistory.length - 1].weight 
            : (currentSex === 'Uomo' ? 75 : 60);

        let bmr = 0;
        if (currentSex === 'Uomo') {
            bmr = (10 * lastWeightRecord) + (6.25 * prof.height) - (5 * prof.age) + 5;
        } else {
            bmr = (10 * lastWeightRecord) + (6.25 * prof.height) - (5 * prof.age) - 161;
        }

        const tdee = bmr * prof.activity;
        const targetKcal = Math.round(tdee * (1 + (prof.deficitPct / 100)));

        document.getElementById('targetKcalDisplay').value = targetKcal;
        updateTodaySummary();
    }

    function addWeightRecord() {
        const w = parseFloat(document.getElementById('currentWeightInput').value);
        if (!w || isNaN(w) || w <= 0) return;

        const prof = appData.profiles[currentSex];
        const todayStr = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });

        prof.weightHistory.push({ date: todayStr, weight: w });
        saveDataToStorage();
        calculateTargetKcal();
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('weightChart').getContext('2d');
        weightChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Peso (kg)',
                    data: [],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: true },
                    y: { display: true }
                }
            }
        });
    }

    function updateChart() {
        if (!weightChartInstance) return;
        const history = appData.profiles[currentSex].weightHistory || [];
        weightChartInstance.data.labels = history.map(h => h.date);
        weightChartInstance.data.datasets[0].data = history.map(h => h.weight);
        weightChartInstance.update();
    }

    function handleSearch(meal) {
        const query = document.getElementById(`foodInput-${meal}`).value.toLowerCase().trim();
        const resultsDiv = document.getElementById(`searchResults-${meal}`);
        resultsDiv.innerHTML = '';

        if (!query) {
            resultsDiv.style.display = 'none';
            return;
        }

        const matches = FOOD_DATABASE.filter(f => f.nome.toLowerCase().includes(query) || (f.marca && f.marca.toLowerCase().includes(query)));
        
        if (matches.length === 0) {
            resultsDiv.style.display = 'none';
            return;
        }

        matches.forEach(match => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item';
            const label = (match.marca && match.marca !== 'Generico') ? `${match.nome} (${match.marca})` : match.nome;
            item.innerText = label;
            item.onclick = function() {
                document.getElementById(`foodInput-${meal}`).value = label;
                document.getElementById(`foodGrams-${meal}`).value = match.porzione_g || 100;
                resultsDiv.style.display = 'none';
            };
            resultsDiv.appendChild(item);
        });

        resultsDiv.style.display = 'block';
    }

    function addFoodToMeal(meal) {
        const inputName = document.getElementById(`foodInput-${meal}`).value.trim();
        let grams = parseFloat(document.getElementById(`foodGrams-${meal}`).value);

        if (!inputName) return;

        const match = FOOD_DATABASE.find(f => {
            const marcaStr = String(f.marca || '').toLowerCase();
            const nomeStr = String(f.nome || '').toLowerCase();
            const label = (marcaStr && marcaStr !== 'generico') ? `${nomeStr} (${marcaStr})` : nomeStr;
            return label === inputName.toLowerCase() || nomeStr === inputName.toLowerCase();
        });

        if (match) {
            const defaultPortion = parseFloat(match.porzione_g) || 100;
            if (!grams || isNaN(grams)) grams = defaultPortion;
            const factor = grams / 100;
            
            const rawKcal = parseFloat(match.kcal) || 0;
            const rawP = parseFloat(match.p) || 0;
            const rawG = parseFloat(match.g) || 0;
            const rawC = parseFloat(match.c) || 0;

            const marcaStr = match.marca || '';
            const nomeStr = match.nome || inputName;

            currentDayFoods.push({
                id: generateID(),
                meal: meal,
                nome: (marcaStr && marcaStr !== 'Generico') ? `${nomeStr} (${marcaStr})` : nomeStr,
                grams: grams,
                kcal: Math.round(rawKcal * factor),
                p: Math.round(rawP * factor * 10) / 10,
                g: Math.round(rawG * factor * 10) / 10,
                c: Math.round(rawC * factor * 10) / 10
            });
        } else {
            if (!grams || isNaN(grams)) grams = 100;
            currentDayFoods.push({
                id: generateID(),
                meal: meal,
                nome: inputName,
                grams: grams,
                kcal: 0, p: 0, g: 0, c: 0
            });
        }

        document.getElementById(`foodInput-${meal}`).value = '';
        document.getElementById(`foodGrams-${meal}`).value = '';
        document.getElementById(`searchResults-${meal}`).style.display = 'none';
        updateTodaySummary();
    }

    function removeFood(id) {
        currentDayFoods = currentDayFoods.filter(f => f.id !== id);
        updateTodaySummary();
    }

    function updateTodaySummary() {
        const meals = ['colazione', 'pranzo', 'cena', 'snack'];
        let totKcal = 0, totP = 0, totG = 0, totC = 0;

        meals.forEach(meal => {
            const listEl = document.getElementById(`list-${meal}`);
            const subEl = document.getElementById(`sub-${meal}`);
            listEl.innerHTML = '';

            const foods = currentDayFoods.filter(f => f.meal === meal);
            let mealKcal = 0;

            foods.forEach(f => {
                mealKcal += f.kcal || 0;
                totKcal += f.kcal || 0;
                totP += f.p || 0;
                totG += f.g || 0;
                totC += f.c || 0;

                const li = document.createElement('li');
                li.className = 'food-item';
                li.innerHTML = `
                    <div class="food-info">
                        <strong>${f.nome} (${f.grams}g)</strong>
                        <span class="food-sub">${f.kcal} kcal | P: ${f.p}g | G: ${f.g}g | C: ${f.c}g</span>
                    </div>
                    <button class="btn-icon btn-danger btn-sm" onclick="removeFood('${f.id}')">✕</button>
                `;
                listEl.appendChild(li);
            });

            subEl.innerText = `${mealKcal} kcal`;
        });

        const targetKcal = parseInt(document.getElementById('targetKcalDisplay').value) || 0;
        document.getElementById('totKcal').innerText = `${totKcal} / ${targetKcal}`;
        document.getElementById('totP').innerText = `${totP.toFixed(1)}g`;
        document.getElementById('totG').innerText = `${totG.toFixed(1)}g`;
        document.getElementById('totC').innerText = `${totC.toFixed(1)}g`;
    }

    function saveCurrentDayToHistory() {
        if (currentDayFoods.length === 0) {
            alert("Nessun alimento inserito per oggi.");
            return;
        }

        const todayStr = new Date().toLocaleDateString('it-IT');
        let totKcal = 0, totP = 0, totG = 0, totC = 0;
        
        currentDayFoods.forEach(f => {
            totKcal += f.kcal || 0;
            totP += f.p || 0;
            totG += f.g || 0;
            totC += f.c || 0;
        });

        const newLog = {
            date: todayStr,
            sex: currentSex,
            foods: [...currentDayFoods],
            summary: {
                kcal: totKcal,
                p: Math.round(totP * 10) / 10,
                g: Math.round(totG * 10) / 10,
                c: Math.round(totC * 10) / 10
            }
        };

        const existingIdx = appData.dailyLogs.findIndex(l => l.date === todayStr && l.sex === currentSex);
        if (existingIdx >= 0) {
            appData.dailyLogs[existingIdx] = newLog;
        } else {
            appData.dailyLogs.unshift(newLog);
        }

        saveDataToStorage();
        renderHistory();
        alert("Giornata salvata con successo nello storico!");
    }

    function renderHistory() {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        if (!appData.dailyLogs || appData.dailyLogs.length === 0) {
            historyList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Nessuna giornata registrata.</p>';
            return;
        }

        appData.dailyLogs.forEach(log => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div>
                    <div class="history-date">${log.date} (${log.sex})</div>
                    <div class="history-details">${log.summary.kcal} Kcal | P: ${log.summary.p}g | G: ${log.summary.g}g | C: ${log.summary.c}g</div>
                </div>
                <button class="btn btn-sm" onclick="loadHistoryDay('${log.date}', '${log.sex}')">Carica</button>
            `;
            historyList.appendChild(item);
        });
    }

    function loadHistoryDay(dateStr, sexStr) {
        const log = appData.dailyLogs.find(l => l.date === dateStr && l.sex === sexStr);
        if (log) {
            currentSex = sexStr;
            document.getElementById('sexSelect').value = currentSex;
            currentDayFoods = JSON.parse(JSON.stringify(log.foods));
            loadProfileUI();
            updateTodaySummary();
            closeDrawer('historyDrawer');
        }
    }

    // Gestione Ricette / Pasti Salvati
    function saveCurrentMealAsRecipe() {
        if (currentDayFoods.length === 0) {
            alert("Non ci sono cibi inseriti nell'interfaccia da salvare come ricetta.");
            return;
        }

        const name = prompt("Inserisci un nome per questo pasto salvato (es. Colazione Standard):");
        if (!name) return;

        const ingredients = currentDayFoods.map(f => ({
            nome: f.nome,
            grams: f.grams
        }));

        appData.recipes.push({
            id: generateID(),
            name: name,
            ingredients: ingredients
        });

        saveDataToStorage();
        renderRecipes();
        alert("Pasto salvato con successo!");
    }

    function renderRecipes() {
        const list = document.getElementById('recipesList');
        list.innerHTML = '';

        if (!appData.recipes || appData.recipes.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Nessun pasto salvato.</p>';
            return;
        }

        appData.recipes.forEach(r => {
            const item = document.createElement('div');
            item.className = 'recipe-item';
            item.innerHTML = `
                <div>
                    <div class="recipe-name">${r.name}</div>
                    <div class="recipe-details">${r.ingredients.length} ingredienti</div>
                </div>
                <button class="btn-icon btn-danger btn-sm" onclick="deleteRecipe('${r.id}')">✕</button>
            `;
            list.appendChild(item);
        });
    }

    function deleteRecipe(id) {
        appData.recipes = appData.recipes.filter(r => r.id !== id);
        saveDataToStorage();
        renderRecipes();
    }

    function openRecipeSelector(mealTarget) {
        if (!appData.recipes || appData.recipes.length === 0) {
            alert("Non hai ancora pasti salvati. Creane uno dal menu 🍲 in alto.");
            return;
        }

        let msg = "Seleziona il numero del pasto pronto da inserire:\n\n";
        appData.recipes.forEach((r, idx) => {
            msg += `${idx + 1}. ${r.name}\n`;
        });

        const choice = prompt(msg);
        const idx = parseInt(choice) - 1;

        if (!isNaN(idx) && appData.recipes[idx]) {
            const recipe = appData.recipes[idx];
            recipe.ingredients.forEach(ing => {
                document.getElementById(`foodInput-${mealTarget}`).value = ing.nome;
                document.getElementById(`foodGrams-${mealTarget}`).value = ing.grams;
                addFoodToMeal(mealTarget);
            });
        }
    }

    // Gestione Drawer UI
    function openDrawer(id) {
        document.getElementById(id).classList.add('open');
    }

    function closeDrawer(id) {
        document.getElementById(id).classList.remove('open');
    }
</script>
